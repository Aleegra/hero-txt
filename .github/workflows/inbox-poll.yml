# Acts on replies to the weekly digest: captures the companies named in one,
# mails back what it read, and publishes once the answer comes back 发布.
#
# Unlike weekly-scan this writes to the library in Supabase, so it is the riskier
# of the two and the only job holding the service-role key. What bounds the risk
# is that the script will only ever create products that appeared in a digest
# we sent — see the header of scripts/inbox-poll.mjs. It no longer writes to git.
name: Inbox poll

on:
  schedule:
    # Every half hour. A reply waits at most that long for its preview, and
    # again for the site to go up.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two runs acting on the same reply would stage its companies twice.
concurrency:
  group: inbox-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      # capture.mjs drives a real browser, so unlike weekly-scan this one
      # genuinely needs the Playwright download.
      - run: npx playwright install --with-deps chromium
      # Same major-version pin as weekly-scan.yml, for the same reason: the API
      # is the moving part and a hard pin rots.
      - run: npm install -g @e2a/cli@2

      - name: Read mail and act on it
        id: poll
        run: node scripts/inbox-poll.mjs
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Two models: the vision one reads hero copy out of a screenshot,
          # the text one picks a category.
          HERO_MODEL: deepseek-v4-flash-vision-exp
          HERO_TEXT_MODEL: DeepSeek-V4-Flash
          E2A_API_KEY: ${{ secrets.E2A_API_KEY }}
          E2A_AGENT_EMAIL: ling@agents.e2a.dev
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Staging is a status in the database: the build reads only published
      # rows, so a staged capture is invisible until 发布 flips it. The site then
      # has to be rebuilt, which happens here rather than by waiting for
      # pages.yml's daily run.
      - uses: actions/configure-pages@v5
        if: steps.poll.outputs.deploy == 'true'
      - name: Build the site
        if: steps.poll.outputs.deploy == 'true'
        run: node scripts/build-site.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.poll.outputs.deploy == 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.poll.outputs.deploy == 'true'
