# dist/ is generated rather than committed, so the site is built here from
# data/ + shots/ on every push.
name: Deploy site

on:
  push:
    branches: [v2]
    paths:
      - 'data/**'
      - 'shots/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # build-site.mjs only reads JSON and copies files, so no install needed.
      - run: node scripts/build-site.mjs
      # enablement creates the Pages site on first run; without it the action
      # errors out with "Get Pages site failed" on a repo that never had Pages on.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
